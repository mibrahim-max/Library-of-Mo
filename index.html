<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mo's Digital Summary Library</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f4f1;--surface:#ffffff;--border:rgba(0,0,0,0.08);--border-hover:rgba(0,0,0,0.18);
  --text:#1a1a1a;--muted:#888;--accent:#1a1a1a;--accent-light:#f0efe9;
  --r-bg:#ffffff;--r-text:#1a1a1a;--r-muted:#777;--r-accent:#1a1a1a;--r-border:rgba(0,0,0,0.08);
}
html,body{height:100%}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.6}
.view{display:none;min-height:100vh}.view.active{display:block}

.lib-header{display:flex;align-items:center;justify-content:space-between;padding:22px 36px;background:var(--surface);border-bottom:0.5px solid var(--border)}
.lib-wordmark{font-family:'DM Serif Display',serif;font-size:19px;color:var(--text);letter-spacing:.01em}
.add-book-btn{display:flex;align-items:center;gap:6px;background:var(--text);color:#fff;border:none;border-radius:8px;padding:8px 16px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:opacity .15s}
.add-book-btn:hover{opacity:.8}
.lib-hero{padding:48px 36px 36px;background:var(--surface);border-bottom:0.5px solid var(--border)}
.lib-hero-eyebrow{font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.lib-hero-title{font-family:'DM Serif Display',serif;font-size:clamp(36px,5vw,58px);line-height:1.06;max-width:580px;color:var(--text)}
.lib-hero-title em{font-style:italic;color:var(--muted)}
.lib-hero-sub{margin-top:14px;color:var(--muted);font-size:14px;max-width:480px;line-height:1.65}
.lib-grid{padding:28px 36px;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.book-card{background:var(--surface);border:0.5px solid var(--border);border-radius:12px;padding:22px 22px 18px;cursor:pointer;transition:border-color .15s,box-shadow .15s;position:relative;overflow:hidden}
.book-card:hover{border-color:var(--border-hover);box-shadow:0 2px 12px rgba(0,0,0,.06)}
.book-card-spine{position:absolute;left:0;top:0;bottom:0;width:3px;background:rgba(0,0,0,0.12);border-radius:12px 0 0 12px;transition:background .2s}
.book-card:hover .book-card-spine{background:var(--text)}
.book-card-genre{font-size:10.5px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;padding-left:10px}
.book-card-title{font-family:'DM Serif Display',serif;font-size:19px;line-height:1.2;margin-bottom:4px;padding-left:10px}
.book-card-author{font-size:12.5px;color:var(--muted);margin-bottom:16px;padding-left:10px}
.book-card-meta{display:flex;align-items:center;border-top:0.5px solid var(--border);padding-top:12px}
.book-card-chapters{font-size:12px;color:var(--muted)}.book-card-chapters span{color:var(--text);font-weight:500}
.book-card-cta{margin-left:auto;font-size:12px;color:var(--muted)}
.book-card-actions{display:flex;gap:6px;margin-left:10px}
.card-action-btn{background:none;border:0.5px solid var(--border);border-radius:6px;padding:3px 9px;font-size:11px;color:var(--muted);cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s}
.card-action-btn:hover{border-color:var(--border-hover);color:var(--text)}
.card-action-btn.del:hover{border-color:#e55;color:#e55}
.empty-state{grid-column:1/-1;text-align:center;padding:80px 20px;color:var(--muted)}
.empty-state-icon{font-size:40px;margin-bottom:14px;opacity:.25}
.empty-state h3{font-family:'DM Serif Display',serif;font-size:22px;color:var(--text);margin-bottom:6px;font-weight:400}

.book-nav{display:flex;align-items:center;padding:20px 36px;border-bottom:0.5px solid var(--border);background:var(--surface);gap:10px}
.back-btn{display:flex;align-items:center;gap:5px;background:none;border:none;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;transition:color .15s}
.back-btn:hover{color:var(--text)}
.book-hero{padding:44px 36px 36px;border-bottom:0.5px solid var(--border);max-width:660px;background:var(--surface)}
.book-hero-genre{font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.book-hero-title{font-family:'DM Serif Display',serif;font-size:clamp(30px,4.5vw,46px);line-height:1.08;margin-bottom:7px}
.book-hero-author{color:var(--muted);font-size:14px;margin-bottom:16px}
.book-hero-desc{color:var(--muted);font-size:14px;line-height:1.7;max-width:500px}
.chapter-list{padding:28px 36px 64px;max-width:700px}
.chapter-list-label{font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:20px}
.chapter-item{display:flex;align-items:flex-start;gap:16px;padding:14px 0;border-bottom:0.5px solid var(--border);cursor:pointer;transition:all .15s}
.chapter-item:hover .ch-title-text{color:var(--muted)}
.chapter-item:first-of-type{border-top:0.5px solid var(--border)}
.chapter-num{font-size:11px;color:var(--muted);min-width:24px;padding-top:3px;font-variant-numeric:tabular-nums}
.ch-title-text{font-family:'DM Serif Display',serif;font-size:17px;line-height:1.3;transition:color .15s;flex:1}
.ch-sub-text{font-size:12px;color:var(--muted);margin-top:2px}
.chapter-item-arrow{color:var(--muted);padding-top:3px;font-size:13px;transition:transform .15s}
.chapter-item:hover .chapter-item-arrow{transform:translateX(3px)}

#reader-view{background:var(--r-bg);color:var(--r-text)}
.reader-nav{display:flex;align-items:center;justify-content:space-between;padding:16px 36px;border-bottom:0.5px solid var(--r-border);background:var(--r-bg);position:sticky;top:0;z-index:10}
.reader-back-btn{display:flex;align-items:center;gap:5px;background:none;border:none;color:var(--r-muted);font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;transition:color .15s}
.reader-back-btn:hover{color:var(--r-text)}
.reader-breadcrumb{font-size:12px;color:var(--r-muted)}
.reader-breadcrumb strong{color:var(--r-text);font-weight:500}
.reader-chapter-nav{display:flex;gap:7px}
.ch-nav-btn{background:none;border:0.5px solid var(--r-border);border-radius:6px;padding:5px 13px;font-family:'DM Sans',sans-serif;font-size:12px;color:var(--r-muted);cursor:pointer;transition:all .15s}
.ch-nav-btn:hover:not(:disabled){border-color:var(--border-hover);color:var(--r-text)}
.ch-nav-btn:disabled{opacity:.3;cursor:default}
.reader-body{max-width:660px;margin:0 auto;padding:56px 36px 110px}
.reader-ch-label{font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--r-muted);margin-bottom:12px}
.reader-title{font-family:'DM Serif Display',serif;font-size:clamp(28px,4.5vw,42px);line-height:1.1;margin-bottom:9px}
.reader-subtitle{font-size:15px;color:var(--r-muted);line-height:1.65;margin-bottom:40px;max-width:500px}
.reader-divider{width:32px;height:1.5px;background:rgba(0,0,0,0.15);margin-bottom:40px}
.reader-content{font-size:16.5px;line-height:1.85;color:#2a2a2a}
.reader-content h3{font-family:'DM Serif Display',serif;font-size:20px;font-weight:400;margin:40px 0 10px;color:var(--r-text)}
.reader-content h4{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--r-muted);margin:32px 0 9px}
.reader-content p{margin-bottom:20px}
.reader-content ul,.reader-content ol{margin:0 0 20px 20px}
.reader-content li{margin-bottom:7px}
.reader-content blockquote{border-left:2px solid rgba(0,0,0,0.15);margin:28px 0;padding:12px 20px;background:rgba(0,0,0,0.025);border-radius:0 6px 6px 0;font-style:italic;color:#555}
.reader-content strong{font-weight:600;color:var(--r-text)}

.chart-block{margin:36px 0;background:#fff;border:0.5px solid rgba(0,0,0,0.08);border-radius:10px;padding:20px 20px 14px;box-shadow:0 1px 8px rgba(0,0,0,.04)}
.chart-title{font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--r-muted);margin-bottom:3px}
.chart-desc{font-size:13px;color:#999;margin-bottom:18px;line-height:1.5}
.chart-block canvas{width:100%!important}
.diagram-block{margin:36px 0}
.triad-row{display:flex;gap:10px;margin:20px 0}
.triad-card{flex:1;border-radius:8px;padding:16px 14px;text-align:center}
.triad-card .tc-icon{font-size:26px;margin-bottom:6px}
.triad-card .tc-label{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px}
.triad-card .tc-name{font-family:'DM Serif Display',serif;font-size:16px;margin-bottom:5px}
.triad-card .tc-desc{font-size:11.5px;line-height:1.5;color:#555}
.triad-damocles{background:#fdf2f2;border:0.5px solid #f5c6c6}.triad-damocles .tc-label{color:#c0392b}
.triad-phoenix{background:#fefaf2;border:0.5px solid #f0dfa0}.triad-phoenix .tc-label{color:#b7860b}
.triad-hydra{background:#f2faf4;border:0.5px solid #a8d5b5}.triad-hydra .tc-label{color:#27ae60}
.barbell-svg{width:100%;height:80px;margin:16px 0}
.spectrum-bar{display:flex;height:40px;border-radius:7px;overflow:hidden;margin:16px 0;font-size:12px;font-weight:500}
.spectrum-seg{display:flex;align-items:center;justify-content:center;flex:1;color:#fff}

.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;align-items:flex-start;justify-content:center;padding:36px 20px;overflow-y:auto}
.modal-overlay.open{display:flex}
.modal{background:#fff;border:0.5px solid rgba(0,0,0,0.1);border-radius:14px;width:100%;max-width:680px;padding:30px;animation:mIn .18s ease}
@keyframes mIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.modal-title{font-family:'DM Serif Display',serif;font-size:21px;font-weight:400}
.modal-close{background:none;border:none;color:#aaa;font-size:18px;cursor:pointer;padding:4px;line-height:1;transition:color .15s}
.modal-close:hover{color:var(--text)}
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.form-input,.form-textarea{width:100%;background:#f9f9f7;border:0.5px solid rgba(0,0,0,0.12);border-radius:7px;padding:10px 12px;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--text);outline:none;transition:border-color .15s;resize:vertical}
.form-input:focus,.form-textarea:focus{border-color:rgba(0,0,0,0.3);background:#fff}
.form-input::placeholder,.form-textarea::placeholder{color:#bbb}
.form-textarea{min-height:80px}
.chapter-form-block{background:#f9f9f7;border:0.5px solid rgba(0,0,0,0.08);border-radius:9px;padding:16px;margin-bottom:9px;position:relative}
.ch-form-row{display:grid;grid-template-columns:100px 1fr;gap:9px;margin-bottom:9px}
.remove-ch-btn{position:absolute;top:11px;right:11px;background:none;border:none;color:#bbb;cursor:pointer;font-size:15px;transition:color .15s;line-height:1}
.remove-ch-btn:hover{color:#e55}
.add-ch-btn{display:flex;align-items:center;gap:7px;background:none;border:0.5px dashed rgba(0,0,0,0.15);border-radius:7px;padding:10px 14px;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;width:100%;justify-content:center;transition:border-color .15s,color .15s;margin-top:3px}
.add-ch-btn:hover{border-color:rgba(0,0,0,0.3);color:var(--text)}
.modal-footer{display:flex;gap:9px;justify-content:flex-end;margin-top:22px;padding-top:16px;border-top:0.5px solid rgba(0,0,0,0.08)}
.btn-cancel{background:none;border:0.5px solid rgba(0,0,0,0.12);border-radius:7px;padding:8px 16px;font-family:'DM Sans',sans-serif;font-size:13.5px;color:var(--muted);cursor:pointer;transition:all .15s}
.btn-cancel:hover{border-color:rgba(0,0,0,0.25);color:var(--text)}
.btn-save{background:var(--text);border:none;border-radius:7px;padding:8px 20px;font-family:'DM Sans',sans-serif;font-size:13.5px;font-weight:500;color:#fff;cursor:pointer;transition:opacity .15s}
.btn-save:hover{opacity:.8}

@media(max-width:600px){
  .lib-header,.lib-hero,.lib-grid,.book-nav,.book-hero,.chapter-list,.reader-nav,.reader-body{padding-left:18px;padding-right:18px}
  .triad-row{flex-direction:column}
  .reader-nav{flex-wrap:wrap;gap:7px}
  .reader-breadcrumb{order:-1;width:100%}
  .ch-form-row{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- LIBRARY -->
<div id="library-view" class="view active">
  <header class="lib-header">
    <div class="lib-wordmark">The Library</div>
    <button class="add-book-btn" onclick="openAddModal()">
      <svg width="13" height="13" viewBox="0 0 14 14" fill="none"><path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      Add book
    </button>
  </header>
  <div class="lib-hero">
    <div class="lib-hero-eyebrow">Your collection</div>
    <h1 class="lib-hero-title">Books worth<br><em>returning to.</em></h1>
    <p class="lib-hero-sub">Some of my favorite books distilled chapter by chapter. Summaries prepared by Mo Ibrahim and enhanced using Claude AI.</p>
  </div>
  <div class="lib-grid" id="book-grid"></div>
</div>

<!-- BOOK VIEW -->
<div id="book-view" class="view">
  <nav class="book-nav">
    <button class="back-btn" onclick="showLibrary()">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Library
    </button>
  </nav>
  <div class="book-hero">
    <div class="book-hero-genre" id="bv-genre"></div>
    <h1 class="book-hero-title" id="bv-title"></h1>
    <div class="book-hero-author" id="bv-author"></div>
    <p class="book-hero-desc" id="bv-desc"></p>
  </div>
  <div class="chapter-list">
    <div class="chapter-list-label">Chapters</div>
    <div id="chapter-list-items"></div>
  </div>
</div>

<!-- READER -->
<div id="reader-view" class="view">
  <nav class="reader-nav">
    <button class="reader-back-btn" onclick="showBookView()">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8l5 5" stroke="#888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      All chapters
    </button>
    <span class="reader-breadcrumb" id="reader-breadcrumb"></span>
    <div class="reader-chapter-nav">
      <button class="ch-nav-btn" id="prev-btn" onclick="navChapter(-1)">← Prev</button>
      <button class="ch-nav-btn" id="next-btn" onclick="navChapter(1)">Next →</button>
    </div>
  </nav>
  <div class="reader-body">
    <div class="reader-ch-label" id="r-label"></div>
    <h1 class="reader-title" id="r-title"></h1>
    <p class="reader-subtitle" id="r-subtitle"></p>
    <div class="reader-divider"></div>
    <div id="r-content"></div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay" onclick="overlayClick(event)">
  <div class="modal">
    <div class="modal-header">
      <h2 class="modal-title" id="modal-title-text">Add a book</h2>
      <button class="modal-close" onclick="closeModal()">&#x2715;</button>
    </div>
    <div class="form-group"><label class="form-label">Title</label><input class="form-input" id="f-title" placeholder="e.g. Antifragile"/></div>
    <div class="form-group"><label class="form-label">Author</label><input class="form-input" id="f-author" placeholder="e.g. Nassim Nicholas Taleb"/></div>
    <div class="form-group"><label class="form-label">Genre / Category</label><input class="form-input" id="f-genre" placeholder="e.g. Philosophy, Finance"/></div>
    <div class="form-group"><label class="form-label">Short description</label><textarea class="form-textarea" id="f-desc" placeholder="One or two sentences..."></textarea></div>
    <div class="form-group">
      <label class="form-label">Chapters</label>
      <div id="chapters-container"></div>
      <button class="add-ch-btn" onclick="addChField()">
        <svg width="13" height="13" viewBox="0 0 14 14" fill="none"><path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        Add chapter
      </button>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="saveBook()">Save book</button>
    </div>
  </div>
</div>

<script>
let books = JSON.parse(localStorage.getItem('lib-books-v4') || '[]');
let deletedIds = JSON.parse(localStorage.getItem('lib-deleted-v4') || '[]');
let editingId = null, currentBook = null, currentChIdx = 0;
const save = () => localStorage.setItem('lib-books-v4', JSON.stringify(books));
const saveDeleted = () => localStorage.setItem('lib-deleted-v4', JSON.stringify(deletedIds));

const ANTIFRAGILE = {
  id: 'antifragile-taleb',
  title: 'Antifragile',
  author: 'Nassim Nicholas Taleb',
  genre: 'Philosophy / Risk',
  description: 'The fourth book in Taleb\'s Incerto series. The argument is simple and it changes everything: fragile things break under pressure, robust things withstand it, and antifragile things actually get better because of it.',
  chapters: [
    {
      number:'01',
      title:'The Antifragile: An Introduction',
      subtitle:'We had words for fragile and robust. We never had a word for the thing that gets stronger.',
      content:`Here is a strange gap in the English language. We have a word for things that break under pressure. We have a word for things that resist pressure. But we have never had a word for the thing that actually improves because of pressure. Taleb opens the book by pointing out that the absence of that word is not a coincidence. It reflects how badly we misunderstand the world.

[DIAGRAM:triad]

The triad he introduces is the frame for everything that follows. Fragile things break. Robust things absorb and stay the same. Antifragile things get better. Your immune system is antifragile. Your muscles are antifragile. Certain businesses, careers, and ideas are antifragile. And yet almost nothing in modern life is designed that way.

The other concept worth sitting with here is domain dependence. People understand antifragility intuitively in some areas and completely miss it in others. The same person who lifts weights to grow stronger will then build a career around total stability and wonder why it feels fragile. The idea does not transfer automatically. You have to apply it deliberately.`,
      charts:['triad']
    },
    {
      number:'02',
      title:'Overcompensation and Overreaction Everywhere',
      subtitle:'Systems do not just recover from stress. They prepare for more of it.',
      content:`When you stress a system, it does not return to where it started. It overshoots. The body builds more muscle than what was broken down. A rumor spreads harder when someone tries to suppress it. A book banned in one country becomes a bestseller everywhere else.

This is not a bug. It is how antifragile systems work. The stress is read as a signal. The system interprets it as evidence that the future will be more demanding than the present, so it prepares accordingly.

[CHART:overcompensation]

The implication is uncomfortable. Removing stress does not create safety. It removes the signal. A system that never gets stressed never learns to prepare for anything harder than the current moment. You are not protecting it. You are quietly making it softer.`,
      charts:['overcompensation']
    },
    {
      number:'03',
      title:'The Cat and the Washing Machine',
      subtitle:'Living systems and engineered systems respond to disorder in completely opposite ways.',
      content:`A washing machine needs predictable conditions to function. Throw something unexpected at it and it breaks. A cat navigates the unexpected constantly. That is not a flaw in the washing machine's design. It reflects a fundamental difference between organic and engineered systems.

Engineered systems are optimized for known conditions. Organic systems are built to handle variance. The problem is that we keep trying to run organic systems like machines, and then we act surprised when they become fragile.

Taleb introduces the concept of touristification here, which is the modern project of smoothing out all volatility from life. Predictable schedules. Stable careers. Controlled environments. It feels responsible. What it actually produces is people and systems that have no idea how to function when things get unpredictable, which they always do eventually.`,
      charts:[]
    },
    {
      number:'04',
      title:'What Kills Me Makes Others Stronger',
      subtitle:'Individual fragility is often what makes a whole system antifragile.',
      content:`Restaurants fail. That information feeds back into the restaurant industry. The bad ones disappear and the ones that survive get better. Species die. Evolution improves. Entrepreneurs lose money. Markets learn what does not work.

The pattern is consistent. Individual failure is not waste. It is information. It is the mechanism through which the whole system gets smarter and more resilient.

[CHART:fragile-parts]

The problem with institutions that are too big to fail is not just economic. It is that bailing them out breaks the feedback loop. The system stops learning. Fragility accumulates silently instead of being discharged in smaller, manageable failures.

> "The ship that sank was a net benefit to shipping safety. The bank that stayed afloat with a bailout was a net cost to the banking system."

The risk takers and entrepreneurs who fail are not casualties. They are doing the work that keeps the broader system from becoming brittle.`,
      charts:['fragile-parts']
    },
    {
      number:'05',
      title:'The Souk and the Office',
      subtitle:'Mediocristan and Extremistan are two different worlds. Most people only know how to think in one of them.',
      content:`Taleb draws a line between two types of environments. In Mediocristan, no single observation changes the average much. Height and weight live here. Daily income for most jobs lives here. The bell curve applies and averages mean something.

Extremistan is different. One event can dominate everything else. Wealth lives here. Book sales live here. Earthquakes and financial markets live here. In Extremistan, the average is nearly meaningless because a single tail event rewrites the whole picture.

[CHART:two-distributions]

The error that keeps repeating in modern life is applying Mediocristan thinking to Extremistan problems. Using standard deviation to model financial risk. Forecasting economic outcomes with confidence intervals that assume normal distributions. It looks rigorous until a Black Swan arrives and the model fails completely.

function setView(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function showLibrary() { setView('library-view'); renderLibrary(); }

function showBookView(bookId) {
  if (bookId !== undefined) currentBook = books.find(b => b.id == bookId);
  if (!currentBook) return;
  document.getElementById('bv-genre').textContent = currentBook.genre || '';
  document.getElementById('bv-title').textContent = currentBook.title;
  document.getElementById('bv-author').textContent = currentBook.author;
  document.getElementById('bv-desc').textContent = currentBook.description || '';
  document.getElementById('chapter-list-items').innerHTML = currentBook.chapters.map((ch, i) => `
    <div class="chapter-item" onclick="showReader(${i})">
      <div class="chapter-num">${String(i+1).padStart(2,'0')}</div>
      <div style="flex:1">
        <div class="ch-title-text">${ch.title}</div>
        ${ch.subtitle ? `<div class="ch-sub-text">${ch.subtitle}</div>` : ''}
      </div>
      <div class="chapter-item-arrow">&#x2192;</div>
    </div>`).join('');
  setView('book-view');
}

function showReader(idx) {
  currentChIdx = idx;
  renderReader();
  setView('reader-view');
  window.scrollTo(0, 0);
}

function renderReader() {
  const ch = currentBook.chapters[currentChIdx];
  const total = currentBook.chapters.length;
  document.getElementById('r-label').textContent = `Chapter ${String(currentChIdx+1).padStart(2,'0')} of ${total}`;
  document.getElementById('reader-breadcrumb').innerHTML = `<strong>${currentBook.title}</strong> &middot; ${ch.title}`;
  document.getElementById('r-title').textContent = ch.title;
  document.getElementById('r-subtitle').textContent = ch.subtitle || '';
  document.getElementById('prev-btn').disabled = currentChIdx === 0;
  document.getElementById('next-btn').disabled = currentChIdx === total - 1;

  const contentEl = document.getElementById('r-content');
  contentEl.innerHTML = '';

  const segments = ch.content.split(/\[(?:CHART|DIAGRAM):([^\]]+)\]/);
  segments.forEach((seg, i) => {
    if (i % 2 === 0) {
      if (seg.trim()) {
        const div = document.createElement('div');
        div.className = 'reader-content';
        div.innerHTML = renderMd(seg.trim());
        contentEl.appendChild(div);
      }
    } else {
      const chartDiv = document.createElement('div');
      chartDiv.id = `chart-${seg}-${Date.now()}-${i}`;
      contentEl.appendChild(chartDiv);
      renderChartOrDiagram(seg, chartDiv);
    }
  });
}

function navChapter(dir) {
  const next = currentChIdx + dir;
  if (next >= 0 && next < currentBook.chapters.length) {
    currentChIdx = next;
    renderReader();
    window.scrollTo(0, 0);
  }
}

function renderMd(text) {
  return text.split('\n\n').map(b => {
    b = b.trim(); if (!b) return '';
    if (b.startsWith('### ')) return `<h3>${b.slice(4)}</h3>`;
    if (b.startsWith('#### ')) return `<h4>${b.slice(5)}</h4>`;
    if (b.startsWith('> ')) return `<blockquote>${inline(b.slice(2))}</blockquote>`;
    if (b.match(/^[-*] /m)) {
      const items = b.split('\n').filter(l=>l.match(/^[-*] /)).map(l=>`<li>${inline(l.replace(/^[-*] /,''))}</li>`).join('');
      return `<ul>${items}</ul>`;
    }
    return `<p>${inline(b)}</p>`;
  }).join('\n');
}
function inline(t) {
  return t.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\*(.*?)\*/g,'<em>$1</em>').replace(/\n/g,'<br>');
}

      { term: 'Optionality', def: 'The right but not the obligation to benefit from an outcome. Options cap your downside and leave upside open. Taleb argues that seeking optionality is a core strategy for building an antifragile life.' },

      { term: 'Skin in the Game', def: 'Having real personal exposure to the consequences of your decisions. Taleb treats this as both a practical requirement for good decision-making and an ethical requirement for anyone affecting others.' },
      { term: 'Iatrogenics', def: 'Harm caused by the treatment rather than the underlying condition. Originally a medical term, Taleb extends it to economic policy, political intervention, and any domain where the attempt to fix something makes it worse.' },
      { term: 'Mediocristan', def: 'An environment governed by bell-curve distributions where no single observation dramatically changes the average. Height, weight, and daily income from a stable job live here. Averages and standard deviations are meaningful.' },
      { term: 'Extremistan', def: 'An environment governed by power laws where a single observation can dominate the entire distribution. Wealth, book sales, earthquakes, and financial markets live here. Averages are misleading and tail events determine outcomes.' },
      { term: 'The Lindy Effect', def: 'The principle that the longer a non-perishable thing has survived, the longer it is likely to continue surviving. Age is evidence of robustness for ideas, technologies, and institutions. The opposite is true for biological organisms.' },
      { term: 'Convexity', def: 'A mathematical property where gains from positive surprises exceed losses from negative surprises of equal magnitude. Convex exposure is the formal definition of an antifragile position. You want to be long convexity.' },
      { term: 'Concavity', def: 'The opposite of convexity. Losses from negative surprises exceed gains from positive ones. Concave exposure is the formal definition of a fragile position. Large shocks cause disproportionately more damage than small ones.' },
      { term: "Jensen's Inequality", def: 'A mathematical theorem stating that for a convex function, the average of outputs exceeds the output of the average input. Taleb uses it as the theoretical foundation for detecting fragility and antifragility in any system.' },
      { term: 'Hormesis', def: 'The biological phenomenon where a small dose of a stressor produces a beneficial effect. Exercise, fasting, and certain toxins in small quantities make organisms stronger. One of the clearest examples of antifragility in nature.' },
      { term: 'Touristification', def: 'The process of removing all volatility and surprise from an experience or environment. Taleb uses it to describe how modern life systematically eliminates the stressors that build antifragility, producing people and systems that are softer than their conditions require.' },
      { term: 'Fragilista', def: 'Someone who creates fragility in others while being personally insulated from consequences. A policymaker who designs systems for people who bear all the risk. An economist who has never run a business. Taleb treats this as an ethical category, not just an intellectual failure.' },
      { term: 'Neomania', def: 'An excessive love of the new for its own sake. Taleb argues it is a fragility multiplier because new things have not been stress-tested. Old things that are still around have survived everything so far. The Lindy Effect is the correction to neomania.' },
      { term: 'Soviet-Harvard Illusion', def: 'The belief that understanding a system gives you the ability to engineer it top-down. Named to evoke both Soviet central planning and academic overconfidence. Silicon Valley emerged from bottom-up tinkering, not from people who understood what they were building.' },
      { term: 'Domain Dependence', def: 'The tendency to understand a concept in one field but fail to apply it in another. The person who lifts weights understands hormesis in the body but builds a fragile career. Knowledge does not automatically transfer across domains.' },
      { term: 'Overcompensation', def: 'The mechanism by which antifragile systems respond to stress by rebuilding beyond their previous baseline. The body grows more muscle than was broken down. A suppressed rumor spreads harder. The overshoot is the engine of antifragility.' },
      { term: 'Rational Flaneur', def: 'Someone who does not plan every step in advance but exploits what presents itself along the way. Taleb contrasts this with the person who commits to a fixed plan. The flaneur generates options while the planner generates commitments.' },
      { term: 'Doxastic Commitment', def: 'Holding a belief and acting on it even when it costs you something. Taleb argues you do not actually hold a belief if you only maintain it when it is convenient. Real conviction requires skin in the game at the level of ideas.' },
      { term: 'Green Lumber Fallacy', def: 'The error of assuming that theoretical knowledge of a domain is what produces results in it. Named after a trader who made a fortune in green lumber futures without knowing what green lumber was. The knowledge that matters and the knowledge that sounds like it matters are often different things.' },
      { term: 'Epiphenomenon', def: 'A secondary effect that accompanies something but does not cause it. Taleb uses it to describe how we routinely mistake correlation for causation. Harvard does not make people successful. Success-prone people also tend to go to Harvard.' },
      { term: 'Procustean Bed', def: 'From Greek mythology, a bed that Procrustes stretched or cut his guests to fit. Taleb uses it to describe the tendency to force complex reality into the fixed shape of our models rather than updating the models to fit reality.' },
      { term: 'Annealing', def: 'A metallurgical process of heating and slowly cooling metal to remove internal stress. Taleb uses it as an analogy for why systems need periodic shocks to discharge accumulated fragility. Preventing all shocks stores the stress rather than releasing it.' },
      { term: 'Asymmetry', def: 'The condition where gains and losses from the same event are not equal in magnitude. Antifragile positions have positive asymmetry. Fragile positions have negative asymmetry. Identifying the direction of your asymmetry is the core diagnostic tool of the book.' },
      { term: 'Noise vs. Signal', def: 'Noise is random variation with no meaningful information content. Signal is variation that contains real information about the underlying system. The more frequently you observe a system, the more noise you see relative to signal, and the more likely you are to intervene on noise.' },
    ];

    const terms = [
      { term: 'Principality', def: 'A state ruled by a single prince rather than a republic. Machiavelli divides principalities into hereditary, new, mixed, and ecclesiastical types, each requiring different management.' },
      { term: 'Hereditary Principality', def: 'A state ruled by the same family across generations. The easiest type to hold because people are accustomed to the ruling line. The main risk is the prince\'s own spectacular failure.' },
      { term: 'Mixed Principality', def: 'A new territory annexed to an existing state. Creates two sets of enemies simultaneously: those who helped the prince get in and expected more than he can deliver, and those loyal to the old ruler.' },
      { term: 'Virtue (Virtu)', def: 'Not moral virtue in the conventional sense. Machiavelli uses virtu to mean the combination of ability, decisiveness, energy, and strategic intelligence that allows a prince to shape events rather than be shaped by them.' },
      { term: 'Fortune (Fortuna)', def: 'The force of circumstance and luck that controls roughly half of human affairs. Fortune cannot be fully controlled, but preparation and boldness can influence how much damage it does and how much benefit it provides.' },

      { term: 'The Fragilista of Power', def: 'Machiavelli\'s version of skin in the game applied to politics: the prince who is not personally exposed to the consequences of his decisions, relying on mercenaries, auxiliaries, or fortune, is fragile in exactly the same way Taleb describes.' },

      { term: 'Loved vs. Feared', def: 'Machiavelli\'s answer is feared, if you cannot be both. Love depends on the judgment of others and disappears when it is inconvenient. Fear, maintained without hatred, is under the prince\'s control.' },
      { term: 'The Lion and the Fox', def: 'Machiavelli\'s two modes of power. The lion uses force and defeats wolves but cannot avoid traps. The fox uses cunning and avoids traps but cannot defeat wolves. A prince must know when to be each.' },
      { term: 'Ecclesiastical Principality', def: 'States governed by religious authority, specifically the papacy in Machiavelli\'s context. He notes with barely concealed irony that they are held without ability or fortune because ancient religious institutions sustain them regardless of the ruler\'s conduct.' },
      { term: 'Hatred vs. Contempt', def: 'Two different threats to a prince. Hatred comes from seizing property or women and leads to active plots. Contempt comes from appearing changeable, weak, or indecisive and leads to being disregarded. Both are dangerous. Contempt is subtler.' },
      { term: 'Cesare Borgia', def: 'Machiavelli\'s primary example of nearly perfect political execution. Built power systematically, eliminated rivals efficiently, managed resentment through proxies, and was ultimately undone only by the one thing he could not control: his father dying while he was ill.' },
      { term: 'Fortresses', def: 'Machiavelli\'s verdict on physical fortifications is sharp: the best fortress is not being hated by the people. A fortress is useful if you fear your own people. If the people support a foreign invader, no wall protects you.' },
      { term: 'Flatterers', def: 'Advisers who tell the prince what he wants to hear rather than what he needs to know. Machiavelli considers them a plague. They proliferate when princes make it dangerous to speak honestly. The solution is structural: designate people whose specific job is honest counsel.' },

      { term: 'Remirro de Orco', def: 'The official Cesare Borgia installed to pacify the Romagna through brutal administrative methods. Once the work was done and the resentment built up, Borgia had him publicly cut in half in the town square. The crowd was satisfied and frightened simultaneously. Machiavelli describes the scene with something close to admiration.' },

      data:{labels:['Child mortality\n(per 1000 births)','Famine deaths\n(per million/yr)','War deaths\n(per 100k/yr)','Extreme poverty\n(% population)','Literacy rate\n(% adults)'],datasets:[
        {label:'~1800',data:[430,1200,40,90,12],backgroundColor:'rgba(192,57,43,.5)',borderColor:red,borderWidth:1.5},
        {label:'Today',data:[37,5,1,9,87],backgroundColor:'rgba(39,174,96,.5)',borderColor:green,borderWidth:1.5}
      ]},
      options:{plugins:{legend:{position:'bottom',labels:{font:{family:'DM Sans'},boxWidth:12,padding:14}}},scales:{x:{grid:{color:'#eee'},ticks:{font:{size:9}}},y:{grid:{color:'#eee'}}},responsive:true}
    }); return;
  }

  if (type === 'happiness-gdp') {
    const canvas = wrapChart('GDP vs. Self-Reported Happiness','Richer countries report more happiness up to a point. After basic needs are met, the correlation weakens. More growth does not reliably produce more wellbeing.',220);
    new Chart(canvas.getContext('2d'), {
      type:'scatter',
      data:{datasets:[
        {label:'Low income countries',data:[{x:1200,y:3.8},{x:2000,y:4.2},{x:3500,y:4.5},{x:5000,y:4.9}],backgroundColor:'rgba(192,57,43,.6)',pointRadius:7},
        {label:'Middle income countries',data:[{x:8000,y:5.5},{x:12000,y:5.8},{x:18000,y:6.1},{x:25000,y:6.3}],backgroundColor:'rgba(183,134,11,.6)',pointRadius:7},
        {label:'High income countries',data:[{x:35000,y:6.8},{x:45000,y:7.0},{x:55000,y:7.1},{x:65000,y:7.2},{x:80000,y:7.3}],backgroundColor:'rgba(39,174,96,.6)',pointRadius:7}
      ]},
      options:{plugins:{legend:{position:'bottom',labels:{font:{family:'DM Sans'},boxWidth:12,padding:14}}},scales:{x:{title:{display:true,text:'GDP per capita ($)',font:{family:'DM Sans',size:11}},grid:{color:'#eee'}},y:{title:{display:true,text:'Self-reported happiness (0-10)',font:{family:'DM Sans',size:11}},min:3,max:8,grid:{color:'#eee'}}},responsive:true}
    }); return;
  }

  if (type === 'human-enhancement') {
    container.innerHTML = '<div class="chart-block"><div class="chart-title">The Convergence of Enhancement Technologies</div><div class="chart-desc">Each technology alone is limited. The convergence of all of them is something new.</div><div style="margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:12.5px;color:#444">' +
      [
        {tech:'Genetic engineering (CRISPR)',status:'Current',capability:'Edit specific genes to eliminate disease or select for traits. Germline editing already demonstrated in humans.'},
        {tech:'Neuropharmacology',status:'Current',capability:'Alter mood, cognition, memory, and personality through drugs. Widely practiced; enhancement use growing.'},
        {tech:'Brain-computer interfaces',status:'Early development',capability:'Direct connection between brain and external systems. Used clinically for paralysis; enhancement applications in development.'},
        {tech:'Artificial intelligence',status:'Rapid development',capability:'External cognitive extension. Already augments human decision-making in medicine, finance, law, and science.'},
        {tech:'Longevity research',status:'Early development',capability:'Targeting the biological mechanisms of aging directly. Some interventions already extend model organism lifespan significantly.'},
        {tech:'Synthetic biology',status:'Current',capability:'Design and build biological systems from scratch. Currently focused on medicine and materials; organism design possible.'}
      ].map(t => '<div style="background:#fff;border:0.5px solid rgba(0,0,0,.07);border-radius:8px;padding:13px"><div style="font-weight:600;color:var(--r-text);margin-bottom:3px;font-size:13px">' + t.tech + '</div><div style="font-size:10.5px;color:var(--r-accent);font-weight:600;text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px">' + t.status + '</div><div style="font-size:12px;color:#555;line-height:1.55">' + t.capability + '</div></div>').join('') +
    '</div></div>'; return;
  }

  if (type === 'sapiens-glossary') {
    const sterms = [
      { term: 'Cognitive Revolution', def: 'The transformation that occurred in Homo sapiens roughly 70,000 years ago, enabling flexible cooperation among large groups of strangers through shared belief in things that do not physically exist. Harari considers this the pivotal event in human history.' },
      { term: 'Agricultural Revolution', def: 'The transition from foraging to farming that began around 10,000 years ago. Harari calls it history\'s biggest fraud: it allowed more humans to exist per square kilometer while making most individual human lives worse by most measurable standards.' },
      { term: 'Scientific Revolution', def: 'The intellectual transformation that began roughly 500 years ago, centered on the admission that there are things we do not yet know and can discover through systematic observation. Harari connects it directly to European imperial expansion.' },
      { term: 'Industrial Revolution', def: 'The shift from muscle and wind power to fossil fuels, beginning in 18th century Britain. Harari treats it primarily as an energy revolution that changed the relationship between human civilization and physical limits.' },
      { term: 'Imagined Order', def: 'A shared belief in something that does not exist in physical reality: a god, a nation, human rights, money, corporations. Imagined orders are what allow strangers to cooperate at scale. Harari argues that all large human societies are built on them.' },
      { term: 'Inter-subjective Reality', def: 'Things that exist because many people believe in them simultaneously, and that have real consequences as a result. Money, laws, nations, and corporations are inter-subjective. They are more real than purely subjective beliefs but less real than physical objects.' },
      { term: 'Homo sapiens', def: 'The specific human species that survived while all others went extinct, characterized by an unusual capacity for flexible, large-scale cooperation through shared fiction. Not the strongest, biggest-brained, or most ancient human species.' },
      { term: 'Forager', def: 'A human who lives by gathering plants and hunting animals rather than farming. Harari argues that foragers likely had better diets, more leisure, and richer environmental knowledge than the farmers who replaced them.' },
      { term: 'Megafauna Extinction', def: 'The disappearance of most large animal species within thousands of years of sapiens arriving in a new region. Harari treats this as evidence that human destructiveness long predates industrial civilization.' },
      { term: 'Humanism', def: 'The secular religion that places human experience and wellbeing at the center of meaning and value. Harari treats it as a faith position rather than a scientifically derived conclusion, noting that science does not tell us that human experience is intrinsically valuable.' },
      { term: 'Universal Religion', def: 'A religion that is in principle available to all humans regardless of birth, as opposed to tribal or ethnic religions. Christianity, Islam, and Buddhism qualify. Universal religions were powerful tools of imperial integration because they could absorb conquered peoples.' },
      { term: 'Imagined Community', def: 'A large group whose members feel solidarity with each other despite never having met. Nations are imagined communities. The feeling of national identity is real; the nation itself exists only because enough people believe it does.' },
      { term: 'The Capitalist Creed', def: 'The belief that economic growth is both possible and desirable; that investment today produces more wealth tomorrow; and that reinvesting profits is the primary moral obligation of economic actors. Harari treats this as a historically specific faith position, not a natural law.' },
      { term: 'Sapiens Paradox', def: 'Harari\'s closing observation: we have the capabilities of gods and the psychological wiring of band-level primates. We can split atoms and edit genomes but we are still running on social software designed for groups of 150. That gap is the central danger of the present moment.' },
      { term: 'The Double Coincidence of Wants', def: 'The economic problem that makes barter inefficient: to trade, you must find someone who has what you want and wants what you have. Money solves this by creating a universal medium that everyone accepts, enabling specialization and exchange at scale.' },
    ];
    const sletters = [...new Set(sterms.map(t => t.term[0]))].sort();
    const sgrouped = sletters.map(l => ({ letter: l, terms: sterms.filter(t => t.term[0] === l) }));
    container.innerHTML = '<div style="margin-top:8px"><div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:32px">' +
      sletters.map(l => '<a href="#sg-' + l + '" style="display:inline-block;background:#fff;border:0.5px solid rgba(0,0,0,.07);border-radius:6px;padding:4px 12px;font-size:12px;font-weight:600;color:var(--r-accent);text-decoration:none" onmouseover="this.style.background=\'var(--r-accent)\';this.style.color=\'#fff\'" onmouseout="this.style.background=\'#fff\';this.style.color=\'var(--r-accent)\'">' + l + '</a>').join('') +
      '</div>' +
      sgrouped.map(g => '<div id="sg-' + g.letter + '" style="margin-bottom:36px"><div style="font-family:\'DM Serif Display\',serif;font-size:28px;color:var(--r-accent);margin-bottom:16px;padding-bottom:8px;border-bottom:2px solid var(--r-border)">' + g.letter + '</div>' +
        g.terms.map(t => '<div style="margin-bottom:20px;padding:18px 20px;background:#fff;border:0.5px solid rgba(0,0,0,.07);border-radius:10px;border-left:3px solid var(--r-accent)"><div style="font-family:\'DM Serif Display\',serif;font-size:19px;color:var(--r-text);margin-bottom:6px">' + t.term + '</div><div style="font-size:15px;line-height:1.75;color:#444">' + t.def + '</div></div>').join('') +
      '</div>').join('') + '</div>';
    return;
  }
  }
}

function renderLibrary() {
  const grid = document.getElementById('book-grid');
  if (!books.length) {
    grid.innerHTML = `<div class="empty-state"><div class="empty-state-icon">&#x1F4DA;</div><h3>Your library is empty</h3><p>Add your first book to get started.</p></div>`;
    return;
  }
  grid.innerHTML = books.map(b => `
    <div class="book-card" onclick="showBookView('${b.id}')">
      <div class="book-card-spine"></div>
      <div class="book-card-genre">${b.genre || 'Book'}</div>
      <div class="book-card-title">${b.title}</div>
      <div class="book-card-author">${b.author}</div>
      <div class="book-card-meta">
        <div class="book-card-chapters"><span>${b.chapters.length}</span> chapter${b.chapters.length!==1?'s':''}</div>
        <div class="book-card-cta">Read &#x2192;</div>
        <div class="book-card-actions" onclick="event.stopPropagation()">
          <button class="card-action-btn" onclick="openAddModal('${b.id}')">Edit</button>
          <button class="card-action-btn del" onclick="deleteBook('${b.id}')">Delete</button>
        </div>
      </div>
    </div>`).join('');
}


const PW_HASH = '9d9bb8408425d06db57b45fd2fb311aec8ab2e54dda7d758f1e4407a722b4f1c';
let _authVerified = false;

async function requireAuth() {
  if (_authVerified) return true;
  const input = prompt('Enter password to make changes:');
  if (!input) return false;
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(input));
  const hash = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
  if (hash === PW_HASH) { _authVerified = true; return true; }
  alert('Incorrect password.'); return false;
}
async function deleteBook(id) {
  if (!await requireAuth()) return;
  if (!confirm('Remove this book from your library?')) return;
  books = books.filter(b => String(b.id) !== String(id));
  if (!deletedIds.includes(String(id))) deletedIds.push(String(id));
  save(); saveDeleted(); renderLibrary();
}

async function openAddModal(bookId) {
  if (!await requireAuth()) return;
  editingId = bookId || null;
  const book = bookId ? books.find(b => b.id == bookId) : null;
  document.getElementById('modal-title-text').textContent = book ? 'Edit book' : 'Add a book';
  document.getElementById('f-title').value = book?.title || '';
  document.getElementById('f-author').value = book?.author || '';
  document.getElementById('f-genre').value = book?.genre || '';
  document.getElementById('f-desc').value = book?.description || '';
  document.getElementById('chapters-container').innerHTML = '';
  (book?.chapters || [{number:'',title:'',subtitle:'',content:''}]).forEach(ch => addChField(ch));
  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); }
function overlayClick(e) { if (e.target===document.getElementById('modal-overlay')) closeModal(); }

function addChField(ch={}) {
  const div = document.createElement('div');
  div.className = 'chapter-form-block';
  div.innerHTML = `
    <button class="remove-ch-btn" onclick="this.parentElement.remove()">&#x2715;</button>
    <div class="ch-form-row">
      <div><label class="form-label">Number</label><input class="form-input ch-num" placeholder="01" value="${ch.number||''}"/></div>
      <div><label class="form-label">Title</label><input class="form-input ch-title" placeholder="Chapter title" value="${ch.title||''}"/></div>
    </div>
    <div class="form-group">
      <label class="form-label">Subtitle (optional)</label>
      <input class="form-input ch-subtitle" placeholder="One-line hook" value="${ch.subtitle||''}"/>
    </div>
    <div class="form-group" style="margin-bottom:0">
      <label class="form-label">Summary</label>
      <textarea class="form-textarea ch-content" style="min-height:100px" placeholder="Markdown supported. Use [CHART:name] or [DIAGRAM:name] to embed visuals.">${ch.content||''}</textarea>
    </div>`;
  document.getElementById('chapters-container').appendChild(div);
}

function saveBook() {
  const title = document.getElementById('f-title').value.trim();
  if (!title) { alert('Please enter a title.'); return; }
  const chapters = [...document.querySelectorAll('#chapters-container .chapter-form-block')].map(b=>({
    number:b.querySelector('.ch-num').value.trim(),
    title:b.querySelector('.ch-title').value.trim(),
    subtitle:b.querySelector('.ch-subtitle').value.trim(),
    content:b.querySelector('.ch-content').value.trim()
  })).filter(c=>c.title);
  const book = {id:editingId||Date.now(),title,author:document.getElementById('f-author').value.trim(),genre:document.getElementById('f-genre').value.trim(),description:document.getElementById('f-desc').value.trim(),chapters};
  if (editingId) { const i=books.findIndex(b=>b.id==editingId); books[i]=book; }
  else books.push(book);
  save(); closeModal(); renderLibrary();
}

renderLibrary();
</script>
